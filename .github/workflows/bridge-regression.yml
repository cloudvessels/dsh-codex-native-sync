name: Bridge regression
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'packages/codex-bridge/**'
      - 'installer/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/bridge-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run portable bridge and installer regression tests
        env:
          DSH_SYNC_DISABLE_UPDATES: '1'
        shell: bash
        run: node --test --test-reporter=tap test/*.test.mjs > bridge-tests.log 2>&1
      - name: Publish test diagnostics in the job summary
        if: always()
        shell: bash
        run: cat bridge-tests.log >> "$GITHUB_STEP_SUMMARY"
